<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf8f4">
<title>Enactus BUC Heads Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Login screen (cosmetic gate, see config.js) -->
<section id="login" class="login" hidden>
  <div class="card login-box">
    <div class="brand big">
      <svg viewBox="0 0 24 24"><path d="M3 3l18 9-18 9 4.5-9z" fill="#f7b500"/></svg>
      Enactus BUC
    </div>
    <p class="mut" style="text-align:center;margin:0">Heads Hub — enter your email to continue</p>
    <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
    <p id="loginErr" class="red" hidden style="margin:0">This email isn’t allowed.</p>
    <button class="btn pri block" id="loginBtn">Continue</button>
  </div>
</section>

<!-- Main app -->
<div id="app" hidden>
  <header class="top wrap">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M3 3l18 9-18 9 4.5-9z" fill="#f7b500"/></svg>
      Enactus BUC
    </div>
    <nav id="nav">
      <button data-v="home">Home</button>
      <button data-v="cal">Calendar</button>
    </nav>
    <button class="gear" data-v="set" aria-label="Settings">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
    </button>
  </header>
  <main id="view" class="wrap"></main>
</div>

<div id="modal"><div id="box"></div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
